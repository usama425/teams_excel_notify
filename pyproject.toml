[project]
name = "teams_excel_notify"
authors = [
    { name = "ERC IT", email = "it@example.com" }
]
description = "Posts a Microsoft Teams message when someone changes a department's Excel file"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe is installed and managed by bench.
    # openpyxl and requests already come with Frappe v16, so nothing else is needed.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
